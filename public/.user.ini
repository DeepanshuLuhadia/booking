; Upload limits for payment-proof screenshots.
;
; Read by PHP-FPM and CGI SAPIs (not by mod_php — see public/.htaccess for
; that). PHP caps uploads BEFORE any application code runs, so without this a
; 10MB screenshot is discarded by the server and Laravel is handed an empty
; request: the customer sees a token-mismatch or "no file" error for a photo
; they did attach.
;
; post_max_size must stay comfortably above upload_max_filesize — it covers the
; whole request body, the file plus every other form field.
;
; NOTE: PHP-FPM caches .user.ini for `user_ini.cache_ttl` seconds (300 by
; default), so a change here can take five minutes to take effect. If uploads
; still bounce after that, the server's own php.ini is the one in force and
; needs the same two values.
upload_max_filesize = 12M
post_max_size = 16M

; A 10MB JPEG decodes to a far larger raw bitmap while being resized.
; ImageCompressor refuses anything over 40 megapixels, which this comfortably
; covers.
memory_limit = 256M
